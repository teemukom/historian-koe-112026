function splat(label,size){
  const pts=[],n=16;
  for(let i=0;i<n*2;i++){const a=Math.PI*i/n;const r=(i%2?0.8:1)*(0.92+0.08*Math.sin(i*7.3));
    pts.push((50+46*r*Math.cos(a)).toFixed(1)+','+(50+46*r*Math.sin(a)).toFixed(1));}
  return `<svg class="splat" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><polygon points="${pts.join(' ')}" fill="#d62839"/><text x="50" y="66" text-anchor="middle" font-size="48" font-weight="700" fill="#fff" font-family="Georgia,serif">${label}</text></svg>`;
}
function zoomBadge(size){
  return `<svg class="splat" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><circle cx="42" cy="42" r="28" fill="#fff" stroke="#d62839" stroke-width="9"/><line x1="63" y1="63" x2="90" y2="90" stroke="#d62839" stroke-width="11" stroke-linecap="round"/><text x="42" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#d62839" font-family="Georgia,serif" font-style="italic">Z</text></svg>`;
}
const badge=(t,size)=> t.num==='Z'?zoomBadge(size):splat(t.num,size);

/* ===================== LOGIC ===================== */
const app=document.getElementById('app');
const lead=document.getElementById('lead');
const QCOUNT=10;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Valitaan 10 kysymystä: 6 monivalintaa + 4 väittämää (jos pankissa riittää) */
function drawQuestions(topic){
  const mcs=shuffle(topic.qs.filter(q=>q.t==='mc'));
  const tfs=shuffle(topic.qs.filter(q=>q.t==='tf'));
  const nTf=Math.min(4,tfs.length), nMc=Math.min(QCOUNT-nTf,mcs.length);
  const picked=shuffle(mcs.slice(0,nMc).concat(tfs.slice(0,nTf)));
  return picked.map(q=>{
    if(q.t==='mc'){
      const opts=shuffle(q.o.map((text,i)=>({text,correct:i===0})));
      return {t:'mc',q:q.q,opts};
    }
    return {t:'tf',q:q.q,a:q.a,e:q.e};
  });
}

let cur=null, quiz=[], answers=[], checked=false;

function home(){
  cur=null;
  lead.textContent='Valitse aihe. Jokaisen aiheen alussa on tärppiosio, jonka jälkeen vastaat kymmeneen kysymykseen. Vastaukset tarkistetaan vasta, kun painat tarkistusnappia.';
  app.innerHTML=`<div class="cards">${TOPICS.map(t=>`
    <button class="card" data-id="${t.id}">
      ${badge(t,64)}
      <div><div class="ct">${t.title}</div><div class="cs">${t.blurb}</div></div>
      <div class="ico">${ICONS[t.icon]}</div>
    </button>`).join('')}</div>`;
  app.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>openTopic(b.dataset.id)));
  window.scrollTo({top:0});
}

function openTopic(id){
  cur=TOPICS.find(t=>t.id===id);
  quiz=drawQuestions(cur);
  answers=new Array(quiz.length).fill(null);
  checked=false;
  lead.textContent='';
  const t=cur;
  app.innerHTML=`
    <button class="back" id="back">← Kaikki aiheet</button>
    <div class="pagehead">${badge(t,70)}<h2>${t.title}</h2></div>
    <section class="memo">
      <h3>Muistilista – tärpit</h3>
      <ul>${t.tarpit.map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="keys"><b>Avainsanat:</b>${t.keys.map(k=>`<span class="chip">${k}</span>`).join('')}</div>
    </section>
    <section class="tasks">
      <div class="holes"></div>
      <h3>Tehtävät</h3>
      <p class="note">${quiz.length} kysymystä. Valitse jokaiseen yksi vastaus. Tarkistus tehdään alla olevasta napista.</p>
      <div id="qs">${quiz.map((q,i)=>qHtml(q,i)).join('')}</div>
      <div class="actions">
        <button class="btn" id="check">Tarkista vastaukset</button>
        <button class="btn alt" id="again">Uudet kysymykset</button>
      </div>
      <div class="result" id="result"></div>
    </section>`;
  document.getElementById('back').onclick=home;
  document.getElementById('again').onclick=()=>{ if(!checked && answers.some(a=>a!==null) && !confirm('Aloitetaanko alusta? Antamasi vastaukset poistuvat.')) return; openTopic(cur.id); };
  document.getElementById('check').onclick=checkAll;
  document.getElementById('qs').addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b||checked) return;
    const i=+b.dataset.q, v=b.dataset.v;
    answers[i]= quiz[i].t==='tf' ? (v==='1') : +v;
    b.closest('.opts').querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
  });
  window.scrollTo({top:0});
}

function qHtml(q,i){
  const kind=q.t==='tf'?'Oikein vai väärin':'Monivalinta';
  const body=q.t==='tf'
    ? `<div class="opts tfg"><button class="opt" data-q="${i}" data-v="1">Oikein</button><button class="opt" data-q="${i}" data-v="0">Väärin</button></div>`
    : `<div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-q="${i}" data-v="${j}">${o.text}</button>`).join('')}</div>`;
  return `<div class="q" id="q${i}"><div><span class="qn">${i+1}.</span><span class="qt">${q.q}</span><span class="kind">${kind}</span></div>${body}<div class="fb"></div></div>`;
}

function checkAll(){
  if(checked) return;
  const missing=answers.filter(a=>a===null).length;
  if(missing>0 && !confirm(`Vastaamatta on ${missing} kysymystä. Tarkistetaanko silti? Vastaamattomat lasketaan vääriksi.`)) return;
  checked=true;
  let score=0;
  quiz.forEach((q,i)=>{
    const box=document.getElementById('q'+i), fb=box.querySelector('.fb');
    const btns=box.querySelectorAll('.opt');
    let ok=false, right='';
    if(q.t==='tf'){
      ok = answers[i]===q.a;
      btns.forEach(b=>{const val=b.dataset.v==='1'; if(val===q.a) b.classList.add('right'); else if(answers[i]===val) b.classList.add('wrong');});
      right = q.a ? 'Väite on oikein.' : 'Väite on väärin. '+(q.e||'');
    }else{
      const ci=q.opts.findIndex(o=>o.correct);
      ok = answers[i]===ci;
      btns.forEach((b,j)=>{ if(j===ci) b.classList.add('right'); else if(answers[i]===j) b.classList.add('wrong'); });
      right = 'Oikea vastaus: '+q.opts[ci].text+'.';
    }
    btns.forEach(b=>{b.disabled=true;b.classList.remove('sel')});
    if(ok) score++;
    box.classList.add(ok?'ok':'bad');
    fb.textContent=(ok?'✓ Oikein. ':(answers[i]===null?'✗ Ei vastausta. ':'✗ Väärin. '))+(ok&&q.t==='mc'?'':right);
  });
  const n=quiz.length;
  const msg= score>=n-1?'Erinomaista! Osaat aiheen hyvin.' : score>=Math.ceil(n*0.7)?'Hyvin menee! Kertaa vielä virheiden aiheet.' : score>=Math.ceil(n*0.5)?'Kohtalaista. Lue tärpit uudelleen ja kokeile uusia kysymyksiä.' : 'Lue tärpit ja kirjan teksti vielä kerran, ja yritä sitten uudelleen.';
  const r=document.getElementById('result');
  r.innerHTML=`<div class="score">${score} / ${n}</div><div class="msg">${msg}</div>`;
  r.classList.add('show');
  document.getElementById('check').disabled=true;
  document.getElementById('check').style.opacity='.5';
  r.scrollIntoView({behavior:'smooth',block:'center'});
}

home();
</script>
